name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            django-version: "5.2"
          - python-version: "3.11"
            django-version: "5.2"
          - python-version: "3.12"
            django-version: "5.2"
          - python-version: "3.12"
            django-version: "6.0"
          - python-version: "3.12"
            django-version: "6.1"
          - python-version: "3.13"
            django-version: "5.2"
          - python-version: "3.13"
            django-version: "6.1"
          - python-version: "3.14"
            django-version: "5.2"
          - python-version: "3.14"
            django-version: "6.1"

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install "django~=${{ matrix.django-version }}.0" pytest pytest-django

      - name: Install package
        run: pip install -e ".[drf]"

      - name: Run tests
        run: pytest tests/ -v

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build and check the distribution
        run: |
          pip install build twine
          python -m build
          twine check dist/*
      - name: Check the wheel contains the templates and static files
        run: |
          python - <<'EOF'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          for needle in (
              "jalali_suite/lookups.py",
              "jalali_suite/templates/jalali_suite/widgets/jalali_date.html",
              "jalali_suite/static/jalali_suite/js/jalali-datepicker.js",
              "jalali_suite/static/jalali_suite/fonts/Vazirmatn-Regular.woff2",
          ):
              assert needle in names, f"missing from wheel: {needle}"
          EOF
